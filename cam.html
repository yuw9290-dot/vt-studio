<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121117" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%91%E2%80%8D%F0%9F%8E%A4%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="thumbs/千駄ヶ谷渋.png" />
  <title>手機鏡頭・VTuber 控制台</title>
  <script type="module" crossorigin src="./assets/cam-DwOgazQU.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/phone-aHxHej4a.js">
  <link rel="stylesheet" crossorigin href="./assets/phone-DQHIrzlG.css">
</head>
<body class="cam-page">
  <video id="preview" playsinline muted autoplay></video>
  <div class="dim" id="dim" hidden><p>螢幕變暗中，畫面照常傳送<br>點一下恢復</p></div>

  <header class="bar">
    <span class="pill" id="state" data-kind="idle">還沒連線</span>
    <a class="home" href="./">← 回首頁</a>
  </header>

  <section class="sheet" id="setup">
    <h1>手機當電腦的鏡頭</h1>
    <p class="sub">在電腦的控制台按「📱 用手機當鏡頭」，掃 QR code 就會自動填好代碼。</p>
    <label class="field">電腦上的代碼
      <input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="例如 K7QXM" />
    </label>
    <button class="primary big" id="go">開始傳送畫面</button>
    <p class="err" id="err" hidden></p>
  </section>

  <section class="dock" id="live" hidden>
    <button id="flip">🔄 換前／後鏡頭</button>
    <button id="dark">🌙 螢幕變暗</button>
    <button id="stop">停止</button>
  </section>

  <aside class="tips" id="tips">
    <b>擺放小訣竅</b>
    <ul>
      <li>手機<b>直放</b>、離你 2～3 公尺，全身都拍得到</li>
      <li>用後鏡頭畫質比較好（預設）</li>
      <li>手機和電腦連同一個 Wi‑Fi 最順</li>
      <li>插著充電，傳畫面很耗電</li>
    </ul>
  </aside>
</body>
</html>
